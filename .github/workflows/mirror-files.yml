name: Copy files

# Downloads every original in manifest.json whose release file is missing here,
# checks its sha256 against the manifest and uploads it as a release file (with the
# project's licence beside it). Never replaces a file that is already here. A new
# git-archive entry's sha256 is recorded and committed back to manifest.json.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Manifest ids to copy (space-separated; empty = everything missing)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: manifest-writer
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Copy missing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/mirror.py mirror --write ${{ inputs.ids }}
      - name: Commit recorded sizes and sha256s
        if: always()
        run: |
          if ! git diff --quiet manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "manifest: record sizes and sha256s from the copy run ${{ github.run_id }}" manifest.json
            git push
          fi
